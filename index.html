<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temporal Millet</title>
  <link rel="icon" type="image/svg+xml" href="logo/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="logo/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="logo/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="logo/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.0/css/bulma.min.css">
  <script src="web.bc.js"></script>
  <style>
    .aside {
      position: sticky;
      /* Safari */
      position: -webkit-sticky;
      top: 0;
      height: 100%;
    }

    .panel-block {
      display: block
    }

    /* Bulma's box and panel shadows are offset downwards and so leave the
       top edge bare; spread them evenly around all four edges instead. */
    .box,
    .panel {
      box-shadow: 0 0 1em rgba(10, 10, 10, 0.12), 0 0 0 1px rgba(10, 10, 10, 0.02);
    }

    pre.syn-ml {
      background: #f6f8fa;
      color: #24292e;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 0.9rem;
      padding: 0.75rem 1rem;
    }

    pre.syn-ml .syn-kw {
      color: #0366d6;
      font-weight: 500;
    }

    pre.syn-ml .syn-ctor {
      color: #267f99;
    }

    pre.syn-ml .syn-op {
      color: #6f42c1;
    }

    pre.syn-ml .syn-str {
      color: #a31515;
    }

    pre.syn-ml .syn-num {
      color: #098658;
    }

    pre.syn-ml .syn-comment {
      color: #008000;
      font-style: italic;
    }

    pre.syn-ml .syn-resource {
      color: #d97706;
    }

    pre.syn-ml .active-redex {
      background-color: #fff3bf;
      color: inherit;
      border-radius: 2px;
      box-shadow: 0 0 0 1px #f0b500;
      /* Make the background repeat on every visual line when the span wraps
         across newlines (which is common inside <pre>). */
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    /* Let the editor box stretch to the height of the side panel, so that the
       two start out level; a longer program still grows the box as before. */
    .contents.columns > .main.column {
      display: flex;
      flex-direction: column;
    }

    .editor-box {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .editor-box .code-editor {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .editor-box .code-editor-input {
      flex-grow: 1;
    }

    .code-editor {
      position: relative;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .code-editor-display,
    .code-editor-input {
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      letter-spacing: 0;
      padding: 0.75em 1em;
      margin: 0;
      border: 1px solid #dbdbdb;
      border-radius: 4px;
      box-sizing: border-box;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      tab-size: 2;
      width: 100%;
    }

    .code-editor-display {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      background: #f6f8fa;
      color: #24292e;
      z-index: 1;
    }

    .code-editor-input {
      position: relative;
      z-index: 2;
      background: transparent;
      color: transparent;
      caret-color: #24292e;
      resize: vertical;
      outline: none;
      display: block;
    }

    .code-editor-input::placeholder {
      color: #9aa0a6;
      opacity: 1;
    }

    .code-editor-input:focus {
      border-color: #485fc7;
      box-shadow: 0 0 0 0.125em rgba(72, 95, 199, 0.25);
    }

    .completed-run-separator {
      display: flex;
      align-items: center;
      text-align: center;
      color: #888;
      font-size: 0.85em;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin: 1.25rem 0;
    }

    .completed-run-separator::before,
    .completed-run-separator::after {
      content: "";
      flex: 1;
      border-bottom: 1px dashed #bbb;
    }

    .completed-run-separator span {
      padding: 0 0.75rem;
    }

    /* Bulma paints the navbar white and above its neighbours, which would
       hide the top of the shadow of the box right below it. */
    /* Bulma's section starts 3rem down; the header does not need that much. */
    .section {
      padding-top: 1.5rem;
    }

    .navbar {
      background-color: transparent;
      margin-bottom: 1.5rem;
    }

    .navbar-brand {
      flex-grow: 1;
    }

    .navbar-brand .brand-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      /* Line the mark up with the left edge of the editor box below. */
      padding-left: 0;
    }

    .navbar-brand .brand-text {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .navbar-brand .brand-title .title {
      margin: 0;
      line-height: 1;
    }

    .navbar-brand .brand-tagline {
      margin: 0;
      color: #7a7a7a;
      font-size: 0.95rem;
      line-height: 1.2;
    }

    .navbar-brand .brand-logo {
      /* Bulma caps navbar images at 1.75rem; the mark spans both lines of
         the brand text. */
      max-height: 3.5rem;
      height: 3.5rem;
      width: 3.5rem;
      display: block;
    }

    .site-footer {
      display: flex;
      justify-content: center;
      padding: 1rem 0 0.5rem;
      font-size: 0.9rem;
    }

    .site-footer .github-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: #7a7a7a;
    }

    .site-footer .github-link:hover {
      /* Bulma's is-info blue, as on the run button and in the logo. */
      color: #3298dc;
    }

    .site-footer .github-link svg {
      width: 18px;
      height: 18px;
    }
  </style>
</head>

<body>
  <section class="section">
    <div class="container" id="container">
    </div>
  </section>
</body>

</html>
